# H2 In-Memory DataSource Configuration
spring.datasource.url=jdbc:h2:mem:square_games;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema initialization for H2
spring.sql.init.mode=always

# JPA / Hibernate for H2 (create-drop for fresh in-memory schema per run)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
